name: ble_proximity_tracker
description: "Pelacak kedekatan perangkat BLE: scan real-time, radar zona RSSI, dan riwayat lokal."
publish_to: 'none'

version: 1.0.2+3

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  equatable: ^3.0.0
  get_it: ^9.3.0
  go_router: ^18.1.0
  intl: ^0.20.3
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.6
  universal_ble: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  drift_dev: ^2.35.1
  build_runner: ^2.16.1
  flutter_launcher_icons: 0.14.4

flutter:
  uses-material-design: true

  fonts:
    - family: ShareTechMono
      fonts:
        - asset: assets/fonts/ShareTechMono-Regular.ttf
    - family: DSEG7Classic
      fonts:
        - asset: assets/fonts/DSEG7Classic-Regular.ttf
        - asset: assets/fonts/DSEG7Classic-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#E0E5EC"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  adaptive_icon_monochrome: assets/icon/app_icon_monochrome.png
  adaptive_icon_foreground_inset: 0
